<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">nVision Core C4 container diagram</title>
  <desc id="desc">C4 container view of nVision Core: an operator runs the Python interface, which invokes the detection pipeline, reads recordings, loads model and filter assets, and writes analysis results. The MATLAB implementation is used for reference validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4 L0,8 Z" fill="#333333"/>
    </marker>
    <style>
      .heading { font: 700 28px Arial, sans-serif; fill: #222222; }
      .caption { font: 400 15px Arial, sans-serif; fill: #555555; }
      .name { font: 700 18px Arial, sans-serif; }
      .kind { font: 400 13px Arial, sans-serif; }
      .body { font: 400 15px Arial, sans-serif; }
      .relation { font: 400 14px Arial, sans-serif; fill: #333333; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .boundary { fill: #ffffff; stroke: #1769aa; stroke-width: 3; }
      .container { fill: #eef6ff; stroke: #1769aa; stroke-width: 3; }
      .person { fill: #f5fff0; stroke: #2d7d32; stroke-width: 3; }
      .external { fill: #fff7eb; stroke: #bf7600; stroke-width: 3; }
      .store { fill: #f7f7f7; stroke: #1769aa; stroke-width: 3; }
      .line { fill: none; stroke: #333333; stroke-width: 2.2; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="60" y="55" class="heading">nVision Core — Container View</text>
  <text x="60" y="82" class="caption">C4 Level 2 · Linux / WSL seizure-detection system</text>

  <circle cx="170" cy="180" r="42" class="person"/>
  <rect x="70" y="225" width="200" height="120" rx="14" class="person"/>
  <text x="170" y="260" text-anchor="middle" class="name" fill="#2d7d32">Operator</text>
  <text x="170" y="282" text-anchor="middle" class="kind" fill="#2d7d32">[Person]</text>
  <text x="170" y="310" text-anchor="middle" class="body" fill="#2d7d32">Runs analysis and</text>
  <text x="170" y="331" text-anchor="middle" class="body" fill="#2d7d32">reviews detections</text>

  <rect x="350" y="135" width="735" height="650" rx="16" class="boundary"/>
  <text x="380" y="175" class="name" fill="#1769aa">nVision Core</text>
  <text x="380" y="199" class="kind" fill="#1769aa">[Software System]</text>
  <text x="380" y="223" class="caption">Five-feature seizure detection</text>

  <rect x="405" y="275" width="270" height="145" rx="12" class="container"/>
  <text x="540" y="313" text-anchor="middle" class="name" fill="#1769aa">Python interface</text>
  <text x="540" y="337" text-anchor="middle" class="kind" fill="#1769aa">[Container]</text>
  <text x="540" y="367" text-anchor="middle" class="body" fill="#1769aa">CLI and launcher</text>
  <text x="540" y="390" text-anchor="middle" class="body" fill="#1769aa">Starts processing</text>

  <rect x="735" y="275" width="290" height="145" rx="12" class="container"/>
  <text x="880" y="313" text-anchor="middle" class="name" fill="#1769aa">Detection pipeline</text>
  <text x="880" y="337" text-anchor="middle" class="kind" fill="#1769aa">[Container]</text>
  <text x="880" y="367" text-anchor="middle" class="body" fill="#1769aa">Filtering, five features,</text>
  <text x="880" y="390" text-anchor="middle" class="body" fill="#1769aa">classification, intervals</text>

  <rect x="405" y="535" width="270" height="130" rx="12" class="container"/>
  <text x="540" y="572" text-anchor="middle" class="name" fill="#1769aa">MATLAB reference</text>
  <text x="540" y="596" text-anchor="middle" class="kind" fill="#1769aa">[Container]</text>
  <text x="540" y="625" text-anchor="middle" class="body" fill="#1769aa">Canonical algorithm</text>
  <text x="540" y="647" text-anchor="middle" class="body" fill="#1769aa">for comparison</text>

  <path d="M760 555 C760 532 1000 532 1000 555 L1000 655 C1000 678 760 678 760 655 Z" class="store"/>
  <ellipse cx="880" cy="555" rx="120" ry="23" class="store"/>
  <text x="880" y="588" text-anchor="middle" class="name" fill="#1769aa">Model and filters</text>
  <text x="880" y="612" text-anchor="middle" class="kind" fill="#1769aa">[Data Store]</text>
  <text x="880" y="640" text-anchor="middle" class="body" fill="#1769aa">Networks, coefficients,</text>
  <text x="880" y="661" text-anchor="middle" class="body" fill="#1769aa">sampling-rate settings</text>

  <path d="M70 570 C70 547 270 547 270 570 L270 670 C270 693 70 693 70 670 Z" class="external"/>
  <ellipse cx="170" cy="570" rx="100" ry="23" class="external"/>
  <text x="170" y="604" text-anchor="middle" class="name" fill="#bf7600">ECoG recordings</text>
  <text x="170" y="628" text-anchor="middle" class="kind" fill="#bf7600">[External Data]</text>
  <text x="170" y="656" text-anchor="middle" class="body" fill="#bf7600">Raw .dat signals</text>

  <path d="M1160 570 C1160 547 1360 547 1360 570 L1360 670 C1360 693 1160 693 1160 670 Z" class="external"/>
  <ellipse cx="1260" cy="570" rx="100" ry="23" class="external"/>
  <text x="1260" y="604" text-anchor="middle" class="name" fill="#bf7600">Analysis results</text>
  <text x="1260" y="628" text-anchor="middle" class="kind" fill="#bf7600">[External Data]</text>
  <text x="1260" y="656" text-anchor="middle" class="body" fill="#bf7600">CSV, JSON, MAT</text>

  <path d="M270 285 L405 330" class="line"/>
  <text x="330" y="291" text-anchor="middle" class="relation">runs</text>
  <path d="M1160 570 L1160 100 L300 100 L270 285" class="line"/>
  <text x="780" y="90" text-anchor="middle" class="relation">reviews</text>
  <path d="M270 600 L405 420" class="line"/>
  <text x="335" y="515" text-anchor="middle" class="relation">reads</text>
  <path d="M675 347 L735 347" class="line"/>
  <text x="705" y="331" text-anchor="middle" class="relation">invokes</text>
  <path d="M880 420 L880 532" class="line"/>
  <text x="904" y="480" class="relation">loads</text>
  <path d="M675 535 L735 420" class="line"/>
  <text x="686" y="478" text-anchor="middle" class="relation">validates</text>
  <path d="M1025 347 L1160 600" class="line"/>
  <text x="1117" y="449" text-anchor="middle" class="relation">writes</text>

  <text x="60" y="845" class="caption">nVision Core · reference implementation preserved · processing paths: 200 / 500 / 1000 Hz</text>
</svg>
