[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvision-python"
version = "0.1.0"
description = "License-free Python five-feature nVision seizure detector"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6==6.9.2; python_version < '3.14'",
    "PySide6>=6.10.1; python_version >= '3.14'",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
